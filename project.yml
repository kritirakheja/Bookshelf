name: Bookshelf
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
targets:
  Bookshelf:
    type: application
    platform: iOS
    sources: [Bookshelf]
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(BOOKSHELF_BUNDLE_ID)
    info:
      path: Bookshelf/Info.plist
      properties:
        CFBundleDisplayName: Bookshelf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Backup & sync (from Config/Local.xcconfig; blank = sync hidden).
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseKey: $(SUPABASE_KEY)
        # Second book source (from Config/Local.xcconfig; blank = Open Library only).
        GoogleBooksKey: $(GOOGLE_BOOKS_KEY)
        NSCameraUsageDescription: Bookshelf uses the camera to scan the barcode on your books.
  BookshelfTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BookshelfTests]
    dependencies:
      - target: Bookshelf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BOOKSHELF_BUNDLE_ID).tests
schemes:
  Bookshelf:
    build:
      targets:
        Bookshelf: all
        BookshelfTests: [test]
    test:
      targets: [BookshelfTests]
