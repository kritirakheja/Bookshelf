name: Bookshelf
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Bookshelf:
    type: application
    platform: iOS
    sources: [Bookshelf]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(BOOKSHELF_BUNDLE_ID)
    info:
      path: Bookshelf/Info.plist
      properties:
        CFBundleDisplayName: Bookshelf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Bookshelf uses the camera to scan the barcode on your books.
  BookshelfTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BookshelfTests]
    dependencies:
      - target: Bookshelf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BOOKSHELF_BUNDLE_ID).tests
schemes:
  Bookshelf:
    build:
      targets:
        Bookshelf: all
        BookshelfTests: [test]
    test:
      targets: [BookshelfTests]
